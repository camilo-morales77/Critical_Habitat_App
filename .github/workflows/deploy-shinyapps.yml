name: Deploy Shiny app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system libraries for spatial packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          install.packages(c(
            "shiny", "shinydashboard", "leaflet", "sf", "terra", "dplyr",
            "DT", "readr", "writexl", "ggplot2", "png", "scales", "rsconnect"
          ))
        shell: Rscript {0}

      - name: Verify app returns a Shiny app object
        run: |
          result <- source("app.R", local = new.env(parent = globalenv()))
          stopifnot(inherits(result$value, "shiny.appobj"))
        shell: Rscript {0}

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_APP_NAME: ${{ secrets.SHINYAPPS_APP_NAME }}
        run: |
          Rscript -e 'rsconnect::setAccountInfo(name = Sys.getenv("SHINYAPPS_ACCOUNT"), token = Sys.getenv("SHINYAPPS_TOKEN"), secret = Sys.getenv("SHINYAPPS_SECRET"))'
          Rscript -e 'rsconnect::deployApp(appDir = ".", appName = Sys.getenv("SHINYAPPS_APP_NAME"), account = Sys.getenv("SHINYAPPS_ACCOUNT"), forceUpdate = TRUE)'
